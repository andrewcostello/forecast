      Y1-Y5. Copy exact generated create argv and output-parser cases from a pinned
      forecast_bridge.py revision, including every optional flag and --config. Legacy
      Jira checks stay green and are mutation-verified. New YouTrack checks stay red.
      Separate test groups for config routing/kind, transport/auth/paging, activity
      history/cycle-time, Item equivalence, create fields/returned readable ID and
      ambiguous outcomes, and caller-driven transitions/comment replay. Assert zero
      mutating requests on preflight field failure and no automatic ambiguous POST
      retry. Real tokens/network are forbidden; injected transports consume fixtures.

      Record evidence and deviations in features/youtrack-support/notes/YT-SEALS.md.
      Use independent recorded/sanitized or explicitly synthetic fixtures in testdata.
      No external network or real credentials. Record each case, expected failure,
      and a concrete mutation that proves the assertion has teeth. New capability
      cases stay red until their named body lands; existing regression cases stay
      green. No xfail, t.Skip, implementation edits or blanket exclusion.
      Build and vet pass. Test group names are predeclared by the plan author in
      config/known-red.yaml; report a mismatch instead of editing that protected file.
