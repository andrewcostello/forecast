    summary: gate — .dispatcher.yaml and .agent/risk-paths.json for forecast
    description: |
      ALREADY DONE, HAND-EDITED. Exists so every other row can name it in
      blockedBy, and so the run has a mechanical gate at all.

      forecast is ONE Go module at the repo root, and unlike claude-workflow
      the compiled binary is gitignored rather than tracked. Both of
      claude-workflow's deliberate gate omissions are therefore unnecessary
      here: `go build` does not dirty the worktree, and `go vet` was measured
