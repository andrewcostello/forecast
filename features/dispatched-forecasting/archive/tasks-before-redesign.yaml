  - key: FC-ADJ
    summary: adjudicate — validate against a held-out run, land or refuse
    description: |
      HELD. Terminal row.

      Hold a run out. Build the reference class from the dogfood-go and
      model-matrix runs, predict the wallet run, and compare when it lands.

      IF THE p80 DOES NOT CONTAIN THE OUTCOME, SAY SO. Do not tune until it
      does. A forecaster that was fitted to the run it predicts has measured
      nothing, and the whole point of holding a run out is to be able to be
      wrong in public.
    type: Task
