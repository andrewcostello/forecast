  - key: FC-3
    summary: bodies — round/review-time model and empirical bootstrap sampling
    description: |
      HELD. Not dispatched until FC-1's coverage report is read.

      Model row_wall_clock = dev + (rounds x review_per_round), sampling rounds
      per (role, model) cell from history rather than treating them as
      constant. Review was measured at 27-50% of wall clock and is charged per
      round by three reviewer seats whichever model implements, so round count
      is the dominant cost driver and it is a random variable.

      This is what makes "a cheaper model that needs more rounds" comparable to
      "an expensive one that needs fewer" — a question the current model cannot
      express.

      Replace the normal-plus-clamp with an empirical bootstrap: resample
      observed durations directly. The clamp at
      internal/montecarlo/simulator.go:100 is the tell that the distribution is
      wrong — durations are right-skewed and strictly positive, so a normal
      puts mass below zero and the code truncates it. A resample makes the
      clamp disappear. Fall back to log-normal only where a cell is too thin to
      resample, and say so in the output.
    type: Task
    estimate: 3h
    labels:
