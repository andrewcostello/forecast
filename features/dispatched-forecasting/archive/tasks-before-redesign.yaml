  - key: FC-SCAFFOLD
    summary: scaffold — the dispatched-observation contract and its two interfaces
    description: |
      CONTRACT ONLY. Write the skeleton that FC-1 through FC-4 fill. Do not
      implement extraction, sampling or simulation in this row.

      Read `docs/TASK-ASSIGNMENT-dispatched-forecasting.md` first — it carries
      the operator's rulings, the measured facts, and the full breakdown. Read
      `docs/BRIEF-dispatched-work-forecasting.md` for why the current model is
      wrong.

      Create `internal/dispatched/` holding:

      1. The record type for one observed dispatched row. It MUST be able to
         distinguish a completed duration from a lower bound, carry a terminal
         outcome as a closed set, carry the bucket key (role, model) using the
         STAMPED model rather than the authored one, carry round count, and
         carry provenance (which run, which source revision).

      2. A reference-class interface that can answer "how many observations in
         this cell" for a cell it has NONE of. A cell absent from a map is NOT
         the same as a cell with n=0; the operator has ruled that empty cells
         are reported rather than predicted, and that ruling is unimplementable
         if the two are indistinguishable. This is the single most important
         property of this contract.

      3. A scheduler interface taking a dependency graph and a concurrency cap
         and returning a completion time plus the critical path. Signature
         only — FC-2 implements it, under differential testing.

      4. Sentinel errors, wrapped with %w. At minimum: a row that cannot be
         attributed to a cell, and a source revision that cannot be parsed. An
         error a caller cannot match on with errors.Is is an error the coverage
         report cannot classify.

      THE RULE THIS ROW MOST LIKELY BREAKS — read claude-workflow's CLAUDE.md
      section "A CONTRACT STATES RULES. IT DOES NOT REPORT MEASUREMENTS." That
      repo spent 15 cross-family panel rounds and $73 learning it, on scaffolds
      shaped exactly like this one.

      It will be tempting to write into this contract that `bodies` and
      `adjudicate` have no observations, that the reference class holds about
      40 rows, or that 47% of the wallet run is uncovered. Every one of those
      is TRUE TODAY AND FALSE after the next dispatcher run. They are
      measurements. They belong in the assignment doc, where they already are,
      and in tests, where they fail loudly. Not here.

      The test: if someone fixed the defect this contract describes, would any
      sentence in it become false? If yes, that sentence is a measurement.

      Comments state purpose and non-obvious constraints. Rationale goes in the
      commit message. The settled modules in these repos run about 0.5:1
      prose-to-code; agent-written ones have hit 4.3:1 and it is paid by every
      later agent.

      DONE MEANS: the package compiles, the gate is green, the interfaces have
      godoc stating rules only, and there is at least one test asserting that a
      zero-observation cell is representable and distinguishable from an absent
      one.
    type: Task
    estimate: 3h
    labels:
      - size:M
      - area:forecasting
    agent: claude
    model: claude-fable-5-1
    effort: high
    role: scaffold
    status: To Do
