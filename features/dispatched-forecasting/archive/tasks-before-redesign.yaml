  - key: FC-1
    summary: bodies — extraction, union reference class, coverage report
    description: |
      Build the reference class from every recoverable dispatched row, and
      report what it does and does NOT cover. A prediction is NOT in scope for
      this row.

      Fill the contract from FC-SCAFFOLD. Read
      `docs/TASK-ASSIGNMENT-dispatched-forecasting.md` section "FC-1" — it
      lists nine edge cases, each of which needs explicit handling AND a test.
      They are not optional and they are not a suggestion; several encode
      operator rulings.

      SOURCES, and each holds something the others do not:
        - ~/Project/dispatcher-runs/*/journal.jsonl — per-event timestamps,
          stamped model, labels, rounds, cost, tokens. Carries NO role field.
        - ~/Project/claude-workflow/features/**/*.yaml at HEAD — role,
          started_at, completed_at, iteration_count, dispatcher_run_id.
        - the same files at every revision in that repo's git history —
          recovers rows since overwritten by a re-run.
      Join on dispatcher_run_id + task key. Take the UNION of the two YAML
      sources; neither is a superset of the other.

      REUSE, DO NOT REWRITE: port
      ~/Project/claude-workflow/features/model-matrix/report.py, function
      journal_facts(). It already computes the dev/review split, round count
      and token totals per row, and is known to work.

      THE TWO OPERATOR RULINGS THIS ROW IMPLEMENTS:

      1. EMPTY CELLS ARE REPORTED, NOT PREDICTED. A (role, model) cell with no
         observations must appear in the output with n=0. Never substitute a
         default distribution, never back off to a pooled bucket, never omit
         it. `estimateDistribution` in internal/montecarlo/simulator.go is the
         anti-pattern — it invents a number when data is missing, and that is
         precisely the failure being removed.

      2. BLOCKED ROWS ARE RIGHT-CENSORED. A blocked row's elapsed time is a
         LOWER BOUND. It is recorded, it is counted, and it NEVER enters a
         duration mean. A row that burned eight rounds and produced nothing
         must never surface as a fast row. Write a test that FAILS if a
         censored row's elapsed time reaches a mean — this rule is easy to
         write, easy to drop in a later refactor, and its failure is silent.

      OUTPUT: `forecast dispatched-reference build --runs-dir … --out …`, plus
      a coverage report that is this row's actual deliverable. Per (role,
      model): n_done, n_blocked, n_censored, duration summary, rounds. Then:
      which cells a named tasks YAML requires and which of those are empty; the
      share of target rows in a covered cell; and rows recovered vs rows
      started, with the shortfall named rather than dropped.

      Expect the honest headline to be that a large share of the target run
      cannot be predicted from data that exists. That is the answer, not a
      failure of the row — do not tune, pool or default your way to a fuller
      table.
    type: Task
    estimate: 4h
