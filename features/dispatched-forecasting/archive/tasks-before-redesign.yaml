      the plan is the deliverable.

      State the honest limits in the output rather than burying them: which
      cells were empty, that n per cell is small, that blocked rows are
      censored lower bounds, and that rows finished by hand after blocking are
      invisible to the data and are not agent throughput.
    type: Task
