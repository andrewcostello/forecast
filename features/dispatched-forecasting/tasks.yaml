  - key: FC-SEALS
    summary: seals — seal evidence, real event order, and source completeness
    description: |
      Read docs/plans/forecasting-contracts.md and docs/plans/execution.md first.

      F1-F4. Test exact/offset-equivalent starts; same key/time across DIFFERENT runs;
      ambiguous identical starts; stale starts; missing run/key; conflicting authoritative
      readings; deterministic evidence ties; hand-finished limitation through Build.
      Use the actual convergence journal ordering, including panel-iterate emitted AFTER
      spawn completion. Assert no silent overlapping wall-time parts and preserve usable
      elapsed when a breakdown is unknown. Exercise missing/empty/unreadable sources,
      explicit multiple roots, superseded merge history, shallow/replaced history,
      Git environment poisoning, byte/commit bounds, cancellation during reads,
      per-source counters, and holdout exclusion before both live/history joins.
      CLI cases cover missing explicit repos, empty/malformed targets, missing flags,
      partial/empty corpus refusal and data errors without usage spam.
      Amend legacy tests only for explicit F1/F2 contract changes. Put temporarily
      red amended cases under the registered owner group (e.g. TestFCEvidenceContract
      subtests), so unrelated bodies do not inherit unnamed known-red failures.
      Preserve all unaffected regression assertions.

      Record evidence and deviations in features/dispatched-forecasting/notes/FC-SEALS.md.
      Use independent recorded/sanitized or explicitly synthetic fixtures in testdata.
      No external network or real credentials. Record each case, expected failure,
      and a concrete mutation that proves the assertion has teeth. New capability
      cases stay red until their named body lands; existing regression cases stay
      green. No xfail, t.Skip, implementation edits or blanket exclusion.
      Build and vet pass. Test group names are predeclared by the plan author in
      config/known-red.yaml; report a mismatch instead of editing that protected file.
