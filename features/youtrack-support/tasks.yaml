      Y1-Y5. Inventory actual CLI/web calls and freeze small neutral DTO/capability
      interfaces, config selection rules, readable IDs/URLs, equivalence expectations,
      field mapping matrix and failure states. Keep Jira signatures/output compatible.
      Define import directions and compile-only YouTrack seams for independent seals.
      No JQL/ADF in neutral types; no YouTrack implementation bodies yet. Record the
      create crash-window limitation and any required external idempotency protocol
      before bodies. Document which Jira-only operations reject YouTrack selection.

      Record evidence and deviations in features/youtrack-support/notes/YT-SCAFFOLD.md.
      Freeze types, error states, ownership and behavior before downstream seals.
      Preserve baseline behavior during source moves. Do not author acceptance tests.
      Build and vet must pass; no undeclared behavior changes.
    type: Task
    estimate: 4h
    labels:
      - size:M
      - area:tracker
      - risk:high
      - phase:youtrack
    agent: claude
    model: claude-fable-5-1
    role: scaffold
    status: To Do
    blockedBy: []
