  - key: FC-2A
    summary: bodies — critical path under a concurrency cap (differential arm A)
    description: |
      HELD. Not dispatched until FC-1's coverage report is read.

      Implement the scheduler interface from FC-SCAFFOLD: given a dependency
      graph and a concurrency cap, sample a duration per row and return the
      completion time plus the critical path.

      This row is one of two INDEPENDENT implementations of the same spec.
      Longest-path-under-a-cap has no reference implementation in this repo,
      and one agent writing both versions produces correlated code in which the
      same off-by-one survives and the agreement property passes vacuously.

      A DISAGREEMENT BETWEEN THE ARMS IS AN ESCALATION, NOT AN ITERATION. Two
      independent implementations of one spec disagreeing means the spec is
      ambiguous at that input. Record the divergent input and escalate for a
      spec decision. Finding it here is this protocol's highest-value output.

      Read blockedBy from the tasks YAML rather than re-deriving waves.
